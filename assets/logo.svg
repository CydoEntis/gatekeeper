<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="gkTitle">
  <title id="gkTitle">Gatekeeper</title>
  <defs>
    <linearGradient id="gkBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <!-- The badge is the gradient; this mask paints the white mark over it. The
         shield is white (kept) and the keyhole is black (cut out), so the
         keyhole shows the badge through it rather than a flat colour. -->
    <mask id="gkMark">
      <rect width="128" height="128" fill="#000"/>
      <path fill="#fff" d="M64 26 L98 38 L98 62 C98 84 84 99 64 106 C44 99 30 84 30 62 L30 38 Z"/>
      <circle cx="64" cy="56" r="8" fill="#000"/>
      <path fill="#000" d="M59.5 60 L68.5 60 L70.5 84 L57.5 84 Z"/>
    </mask>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#gkBadge)"/>
  <rect width="128" height="128" fill="#fff" mask="url(#gkMark)"/>
</svg>
